<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>房屋管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  body{background:#f5f6fa;font-size:14px;overflow-x:hidden}
  .sidebar{width:235px;min-height:100vh;background:#1f2937;display:flex;flex-direction:column;position:sticky;top:0;flex-shrink:0}
  .sidebar .nav-link{color:#9ca3af;padding:.5rem .8rem;border-radius:6px;margin-bottom:2px;cursor:pointer;font-size:14px}
  .sidebar .nav-link:hover{background:#374151;color:#fff}
  .sidebar .nav-link.active{background:#2563eb;color:#fff}
  .cur-row{display:flex;gap:6px;align-items:center;margin-top:8px}
  .cur-row select{background:#111827;border:0;color:#e5e7eb;font-size:12px;border-radius:6px;padding:5px 8px;flex:1}
  .cur-row select:focus{outline:none;box-shadow:0 0 0 2px #2563eb}
  .cur-row button{background:#111827;border:0;color:#9ca3af;border-radius:6px;padding:5px 9px;font-size:12px}
  .cur-row button:hover{color:#fff;background:#374151}
  .stat-card{border:none;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .stat-card .num{font-size:22px;font-weight:700}
  .card{border:none;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .table>thead{font-size:13px;color:#6b7280}
  .table td,.table th{vertical-align:middle}
  .table-responsive{max-height:calc(100vh - 260px);overflow:auto}
  .room-card{cursor:pointer;transition:.15s;border-width:2px !important}
  .room-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .room-card .rno{font-size:17px;font-weight:700}
  .legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
  .seg-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #e5e7eb;font-size:13px}
  .seg-row:last-child{border-bottom:0}
  .bw-tag{display:inline-block;padding:1px 8px;border-radius:10px;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:600}
  .bw-add{background:#dcfce7;color:#166534}
  .bw-reduce{background:#fee2e2;color:#991b1b}
  .op-group-title{font-weight:600;color:#6c757d;font-size:13px;border-top:1px dashed #dee2e6;padding:6px 0 2px}
  .op-group-title:first-child{border-top:0;padding-top:0}
  .op-item{flex:0 0 178px;margin-right:6px;margin-bottom:0}
  .sug-drop{display:none;position:absolute;top:100%;left:0;right:0;z-index:1080;background:#fff;border:1px solid #dee2e6;border-radius:6px;max-height:220px;overflow:auto;box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .sug-drop .sug-item{padding:6px 10px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sug-drop .sug-item:hover{background:#f1f3f5}
  /* ===== 统一弹窗 UI（提示 / 表单） ===== */
  .ui-dialog-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:1200;display:flex;align-items:center;justify-content:center}
  .ui-dialog{background:#fff;border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.2);width:360px;max-width:92vw;padding:26px 26px 20px;text-align:center}
  .ui-dialog-icon{width:48px;height:48px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:#eff6ff;color:#2563eb}
  .ui-dialog-icon.warn{background:#fff7ed;color:#ea580c}
  .ui-dialog-icon.err{background:#fef2f2;color:#dc2626}
  .ui-dialog-icon.ok{background:#ecfdf5;color:#059669}
  .ui-dialog-title{font-size:16px;font-weight:600;color:#111827;margin-bottom:8px}
  .ui-dialog-body{font-size:14px;color:#4b5563;line-height:1.75;word-break:break-word;white-space:pre-wrap}
  .ui-dialog-actions{display:flex;gap:10px;justify-content:center;margin-top:20px}
  .ui-dialog-actions .btn{min-width:92px;border-radius:8px;font-size:14px;padding:7px 18px}
  .ui-dialog-actions .btn-primary{background:#2563eb;border-color:#2563eb}
  .ui-dialog-actions .btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8}
  /* Bootstrap 表单弹窗统一风格 */
  .modal-content{border:none;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.22);overflow:hidden}
  .modal-header{border-bottom:1px solid #f1f3f5;padding:15px 22px;background:#fafbfc}
  .modal-title{font-size:16px;font-weight:600;color:#111827}
  .modal-header .btn-close{opacity:.6}
  .modal-body{padding:22px}
  .modal-footer{border-top:1px solid #f1f3f5;padding:13px 22px;background:#fafbfc}
  .modal-footer .btn{border-radius:8px;font-size:14px;padding:7px 20px;min-width:88px}
  .modal-footer .btn-primary{background:#2563eb;border-color:#2563eb}
  .modal-footer .btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8}
  .form-label{font-size:13px;color:#374151;font-weight:500;margin-bottom:6px}
  .form-control,.form-select{border-radius:8px;border-color:#d1d5db;font-size:14px;padding:8px 12px}
  .form-control:focus,.form-select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .form-text{font-size:12px;color:#6b7280}
  .btn{border-radius:8px}
  .btn-outline-primary{border-color:#2563eb;color:#2563eb}
  .btn-outline-primary:hover{background:#2563eb;border-color:#2563eb}
  .badge{border-radius:6px;font-weight:500}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
</style>
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<div id="modalHost"></div>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/app.js" defer></script>
</body>
</html>
