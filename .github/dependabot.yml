version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: refactor/independent-portals
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Phnom_Penh
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      npm-runtime:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: refactor/independent-portals
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Phnom_Penh
    open-pull-requests-limit: 5
