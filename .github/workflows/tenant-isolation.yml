name: Tenant isolation tests

on:
  push:
    branches: [main, refactor/independent-portals]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit fix
      - run: npm test
      - name: Commit compatible dependency security updates
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json package.json
            git commit -m "fix: remediate audited production dependencies"
            git push
          fi
